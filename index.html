<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers' Day Message Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="decor"></div>
    <h1>Happy Teachers' Day!</h1>
    <h2 id="teacherName">Dear [Teacher's Name]</h2>
    <p id="message">
      Thank you for your patience, wisdom, and endless dedication.  
      You inspire us to learn, grow, and dream big.  

      We appreciate everything you do!
    </p>
    <h3 id="senderName">— From [Your Name]</h3>
    <button id="celebrateBtn">🎉 Celebrate</button>
  </div>

  <div class="controls">
    <input type="text" id="inputTeacher" placeholder="Enter Teacher's Name">
    <input type="text" id="inputSender" placeholder="Enter Your Name">
    <textarea id="inputMessage" placeholder="Write your message..."></textarea>
    <button id="updateBtn">Update Message</button>
  </div>

  <script src="script.js"></script>

</body>
</html>
